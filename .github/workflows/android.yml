name: Build APK

on:
  push:
    branches: [ main, master, custom-v0.118.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK (Online Flavor)
        run: ./gradlew assembleOnlineDebug
      - name: Build APK (Offline Flavor)
        run: ./gradlew assembleOfflineDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: termux-apks
          path: app/build/outputs/apk/**/*.apk
